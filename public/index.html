<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <link rel="icon" href="%PUBLIC_URL%/owl-logo.png" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/owl-logo.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <!--
      Fallback metadata only. <Seo /> supplies the real per-route title, description,
      canonical, hreflang and Open Graph tags, and scripts/prerender.js strips these
      data-default tags out of the prerendered HTML so nothing is duplicated.
      They exist so the site still has sane metadata if prerendering is ever skipped.
    -->
    <title data-default="true">Piano, Violin &amp; Viola Lessons — Northbrook &amp; Glenview IL</title>
    <meta
      data-default="true"
      name="description"
      content="Private piano, violin, and viola lessons on Chicago's North Shore. Serving Northbrook, Glenview, Northfield, Winnetka, Wilmette, and Lake Forest."
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://res.cloudinary.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Nunito:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
